<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="style.css">

    <title>Grade calculator</title>
</head>
<body>
    <div class ="gradebox">
    <h1>Calculate your grade : </h1>
    <LABEL>Assignment</LABEL>
  <input id="ObtainedAssignment" placeholder="Obtained">
  <input id="TotalAssignment" placeholder="Total">

    <br>
    <label>Quiz</label>
    <input id="ObtainedQuiz" placeholder="Obtained">
    <input id="TotalQuiz" placeholder="Total">
    <br>
    <br>
    <label>Sessional 1 </label>
    <input id="ObtainedSes1"   placeholder="Obtained">
  <input id="TotalSes1"  placeholder="Total">
    <br>
    <br>
        <label>Sessional 2 </label>
 <input  id="ObtainedSes2" placeholder="Obtained">
  <input id="TotalSes2"   placeholder="Total">
    <br>
    <br>
    <label>Final </label>
    <input id="ObtainedFinal"  placeholder="Obtained">
  <input id="TotalFinal"  placeholder="Total">
    <br>
    <br>
    <button id="calculateGrade">Calculate grade </button>
<p id ="result">your grade is : </p>

    </div>
</body>
</html>
